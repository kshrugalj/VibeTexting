[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetexting"
version = "0.1.0"
description = "AI-powered text response generator with personal style mimicry"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "prompt-toolkit>=3.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]

[project.scripts]
vibetexting = "vibetexting.cli:main"
vibe-extract = "extract_imessage_vibe:main"

[tool.setuptools]
packages = ["vibetexting"]
py-modules = ["extract_imessage_vibe"]
